
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机长起飞记录 - 个人飞行日志</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* 防止滚动条出现时布局闪烁 */
    html {
      overflow-y: scroll; /* 始终显示垂直滚动条，即使内容不足 */
      scrollbar-gutter: stable; /* 为滚动条预留空间 */
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    
    .mono { font-family: 'JetBrains+Mono', monospace; }
    
    .glass {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .glow-blue {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
    }
    
    /* Custom scrollbar - 细窄设计 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
      transition: background 0.2s;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    
    /* Firefox 滚动条样式 */
    * {
      scrollbar-width: thin;
      scrollbar-color: #334155 #0f172a;
    }
  </style>
